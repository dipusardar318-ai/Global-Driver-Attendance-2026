<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance System (12 Hours Shift)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      background: #ffffff;
      max-width: 480px;
      width: 100%;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      padding: 24px;
    }

    h2 {
      text-align: center;
      color: #0f172a;
      margin-bottom: 4px;
      font-size: 1.4rem;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      font-size: 0.85rem;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .form-group input:focus {
      border-color: #2563eb;
    }

    .form-group input:disabled {
      background: #f1f5f9;
      color: #64748b;
      cursor: not-allowed;
    }

    .timer-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 16px;
      text-align: center;
      margin-bottom: 20px;
    }

    .timer-display {
      font-size: 2.2rem;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: 1px;
    }

    .target-text {
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 4px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #e2e8f0;
      border-radius: 4px;
      margin-top: 12px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #2563eb;
      transition: width 0.3s ease;
    }

    .status-alert {
      font-size: 0.85rem;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 16px;
      display: none;
      text-align: center;
    }

    .status-alert.active {
      display: block;
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }

    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-checkin {
      background: #16a34a;
      color: #ffffff;
    }

    .btn-checkin:hover:not(:disabled) {
      background: #15803d;
    }

    .btn-checkout {
      background: #dc2626;
      color: #ffffff;
    }

    .btn-checkout:hover:not(:disabled) {
      background: #b91c1c;
    }

    button:disabled {
      background: #cbd5e1;
      color: #94a3b8;
      cursor: not-allowed;
    }

    /* Share Section */
    .share-box {
      display: none;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 20px;
    }

    .share-box h4 {
      font-size: 0.9rem;
      color: #166534;
      margin-bottom: 8px;
    }

    .share-buttons {
      display: flex;
      gap: 8px;
    }

    .btn-share-wa {
      background: #25d366;
      color: #ffffff;
      padding: 10px;
      font-size: 0.85rem;
      border-radius: 6px;
      text-decoration: none;
      display: inline-block;
      text-align: center;
      font-weight: 600;
      flex: 1;
    }

    .btn-copy {
      background: #0f172a;
      color: #ffffff;
      padding: 10px;
      font-size: 0.85rem;
      border-radius: 6px;
      flex: 1;
    }

    .history-card {
      border-top: 1px solid #e2e8f0;
      padding-top: 16px;
    }

    .history-card h3 {
      font-size: 0.95rem;
      color: #334155;
      margin-bottom: 12px;
    }

    .log-item {
      font-size: 0.82rem;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 8px;
      line-height: 1.5;
    }

    .log-item a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Daily Attendance</h2>
    <p class="subtitle">Automatic Location Tracking System</p>

    <!-- Employee Name Input -->
    <div class="form-group">
      <label for="empName">  (Employee Name):</label>
      <input type="text" id="empName" placeholder="   ...">
    </div>

    <div class="timer-card">
      <div class="timer-display" id="timer">00:00:00</div>
      <div class="target-text"> :   (12:00:00)</div>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>

    <div id="statusMessage" class="status-alert"></div>

    <div class="btn-group">
      <button id="btnCheckIn" class="btn-checkin" onclick="handleAttendance('Check-in')">Check In</button>
      <button id="btnCheckOut" class="btn-checkout" onclick="handleAttendance('Check-out')" disabled>Check Out</button>
    </div>

    <!-- Share Link Area -->
    <div id="shareBox" class="share-box">
      <h4>   :</h4>
      <div class="share-buttons">
        <a id="waShareBtn" class="btn-share-wa" href="#" target="_blank">WhatsApp- </a>
        <button class="btn-copy" onclick="copyReportLink()"> </button>
      </div>
    </div>

    <div class="history-card">
      <h3>  :</h3>
      <div id="logContainer">
        <p style="color: #94a3b8; font-size: 0.85rem;">     </p>
      </div>
    </div>
  </div>

  <script>
    let checkInTimestamp = null;
    let timerInterval = null;
    const targetHours = 12;
    const targetMilliseconds = targetHours * 60 * 60 * 1000;
    let latestShareText = "";

    const empNameInput = document.getElementById('empName');
    const btnCheckIn = document.getElementById('btnCheckIn');
    const btnCheckOut = document.getElementById('btnCheckOut');
    const timerDisplay = document.getElementById('timer');
    const progressBar = document.getElementById('progressBar');
    const statusMessage = document.getElementById('statusMessage');
    const logContainer = document.getElementById('logContainer');
    const shareBox = document.getElementById('shareBox');
    const waShareBtn = document.getElementById('waShareBtn');

    function showStatus(text) {
      statusMessage.textContent = text;
      statusMessage.classList.add('active');
    }

    function hideStatus() {
      statusMessage.classList.remove('active');
      statusMessage.textContent = '';
    }

    function handleAttendance(actionType) {
      const employeeName = empNameInput.value.trim();

      //    -   
      if (!employeeName) {
        alert("     (Employee Name) !");
        empNameInput.focus();
        return;
      }

      if (!navigator.geolocation) {
        alert("      ");
        return;
      }

      showStatus("   ,    ...");

      navigator.geolocation.getCurrentPosition(
        (position) => {
          hideStatus();
          const lat = position.coords.latitude.toFixed(6);
          const lon = position.coords.longitude.toFixed(6);
          const now = new Date();
          const dateString = now.toLocaleDateString();
          const timeString = now.toLocaleTimeString();
          const mapLink = `https://maps.google.com/?q=${lat},${lon}`;

          if (actionType === 'Check-in') {
            checkInTimestamp = now.getTime();
            startTimer();
            empNameInput.disabled = true; // -     
            btnCheckIn.disabled = true;
            btnCheckOut.disabled = false;
          } else {
            stopTimer();
            empNameInput.disabled = false;
            btnCheckIn.disabled = false;
            btnCheckOut.disabled = true;
          }

          // WhatsApp      
          latestShareText = ` Attendance Update\n` +
            `Employee: ${employeeName}\n` +
            `Status: ${actionType}\n` +
            `Date: ${dateString}\n` +
            `Time: ${timeString}\n` +
            `Location: ${mapLink}`;

          // WhatsApp   
          waShareBtn.href = `https://api.whatsapp.com/send?text=${encodeURIComponent(latestShareText)}`;
          shareBox.style.display = 'block';

          appendLog(employeeName, actionType, timeString, mapLink);
        },
        (error) => {
          hideStatus();
          if (error.code === error.PERMISSION_DENIED) {
            alert("       Location Permission 'Allow' ");
          } else {
            alert("     GPS     ");
          }
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }

    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const elapsed = Date.now() - checkInTimestamp;

        const hours = Math.floor(elapsed / (1000 * 60 * 60));
        const minutes = Math.floor((elapsed % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((elapsed % (1000 * 60)) / 1000);

        timerDisplay.textContent = 
          `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

        const progressPercent = Math.min((elapsed / targetMilliseconds) * 100, 100);
        progressBar.style.width = `${progressPercent}%`;

        if (elapsed >= targetMilliseconds) {
          progressBar.style.background = '#16a34a';
        }
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
    }

    function appendLog(name, action, time, mapLink) {
      if (logContainer.querySelector('p')) {
        logContainer.innerHTML = '';
      }

      const logItem = document.createElement('div');
      logItem.className = 'log-item';
      logItem.innerHTML = `
        <strong>${name}</strong>  <span>${action}</span> (${time})<br>
        <a href="${mapLink}" target="_blank">Google Maps-   </a>
      `;

      logContainer.prepend(logItem);
    }

    function copyReportLink() {
      if (!latestShareText) return;
      navigator.clipboard.writeText(latestShareText).then(() => {
        alert("    !");
      });
    }
  </script>
</body>
</html>
